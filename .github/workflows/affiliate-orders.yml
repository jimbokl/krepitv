name: Приватная проверка заказов Яндекс Маркета

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read

concurrency:
  group: krepitv-affiliate-orders
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'jimbokl/krepitv' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Настроить Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Проверить генерацию и VID-манифесты
        shell: bash
        run: |
          set -euo pipefail
          npm run affiliate:validate
          npm run affiliate:validate-hubs
          npm run affiliate:check-model-manifest
          npm run affiliate:validate-models

      - name: Синхронизировать обезличенные статусы
        env:
          KREPITV_ORDER_HMAC_SECRET: ${{ secrets.KREPITV_ORDER_HMAC_SECRET }}
          YANDEX_MARKET_AFFILIATE_OAUTH: ${{ secrets.YANDEX_MARKET_AFFILIATE_OAUTH }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${YANDEX_MARKET_AFFILIATE_OAUTH:-}" ]; then
            echo "::error::Не настроен секрет YANDEX_MARKET_AFFILIATE_OAUTH"
            exit 1
          fi
          if [ "${#KREPITV_ORDER_HMAC_SECRET}" -lt 32 ]; then
            echo "::error::Не настроен секрет KREPITV_ORDER_HMAC_SECRET"
            exit 1
          fi
          npm run affiliate:orders-sync -- \
            --model-placements data/affiliate/model-page-placements.json \
            --backfill-start 2026-07-30T00:00:00+03:00 \
            > /dev/null

      - name: Собрать безопасный месячный агрегат
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          month="$(node -e 'process.stdout.write(new Date(Date.now() + 3 * 60 * 60 * 1000).toISOString().slice(0, 7))')"
          aggregate_path=".private/affiliate-orders/aggregates/${month}.json"
          npm run affiliate:orders-winners -- \
            --month "$month" \
            --out "$aggregate_path" \
            --manifest data/affiliate/market-products.json \
            --hub-placements data/affiliate/seo-hub-placements.json \
            --model-placements data/affiliate/model-page-placements.json
          chmod -R go-rwx .private/affiliate-orders
          echo "month=$month" >> "$GITHUB_OUTPUT"
          echo "path=$aggregate_path" >> "$GITHUB_OUTPUT"

          node --input-type=module - "$aggregate_path" <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          import { assertSafeOrdersAggregate } from "./scripts/affiliate/orders.mjs";

          const aggregate = assertSafeOrdersAggregate(
            JSON.parse(await readFile(process.argv[2], "utf8")),
          );
          const winner = aggregate.attribution_winners.rows[0] ?? null;
          process.stdout.write([
            "### Яндекс Маркет — месячный агрегат",
            "",
            `- Месяц: ${aggregate.month}`,
            `- APPROVED заказов: ${aggregate.approved.orders}`,
            `- Подтверждённое вознаграждение: ${aggregate.approved.payment_kopecks} коп.`,
            `- NEW: ${aggregate.pending_current.new_orders}`,
            `- ON_HOLD: ${aggregate.pending_current.on_hold_orders}`,
            `- CANCELLED в месяце: ${aggregate.cancelled_in_month.orders}`,
            `- Групп с сигналом: ${aggregate.attribution_winners.rows.length}`,
            ...(winner ? [
              `- Лидер: ${winner.surface} · ${winner.landing_path} · ${winner.entity_id} · rank ${winner.rank ?? "—"} · APPROVED ${winner.orders.APPROVED} · ${winner.approved_payment_kopecks} коп.`,
            ] : []),
            `- Данные API по: ${aggregate.data_as_of}`,
            "",
          ].join("\n"));
          NODE

      - name: Сохранить только обезличенный агрегат
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affiliate-orders-aggregate-${{ steps.aggregate.outputs.month }}-${{ github.run_id }}
          path: ${{ steps.aggregate.outputs.path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
          include-hidden-files: true

      - name: Уничтожить временный реестр
        if: always()
        shell: bash
        run: rm -rf .private/affiliate-orders
