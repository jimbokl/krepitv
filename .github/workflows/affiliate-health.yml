name: Проверка предложений Яндекс Маркета

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: krepitv-affiliate-health
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'jimbokl/krepitv' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Установить зависимости интерфейса
        run: npm --prefix web ci --no-audit --no-fund

      - name: Настроить Rust и WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Восстановить кэш Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: affiliate-health

      - name: Установить wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(wasm-pack --version 2>/dev/null || true)" != "wasm-pack 0.13.1" ]; then
            cargo install wasm-pack --version 0.13.1 --locked
          fi
          wasm-pack --version

      - name: Проверить манифест
        run: npm run affiliate:validate

      - name: Определить количество карточек
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          count="$(node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("data/affiliate/market-products.json", "utf8"));
            process.stdout.write(String(data.cards.length));
          ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "Манифест пуст: безопасный запуск без сетевых запросов и публикации."
          fi

      - name: Проверить настройки API
        if: steps.manifest.outputs.count != '0'
        env:
          YANDEX_MARKET_AFFILIATE_OAUTH: ${{ secrets.YANDEX_MARKET_AFFILIATE_OAUTH }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${YANDEX_MARKET_AFFILIATE_OAUTH:-}" ]; then
            echo "::error::Не настроен секрет YANDEX_MARKET_AFFILIATE_OAUTH"
            exit 1
          fi

      - name: Проверить карточки с повторами
        if: steps.manifest.outputs.count != '0'
        id: check
        env:
          YANDEX_MARKET_AFFILIATE_OAUTH: ${{ secrets.YANDEX_MARKET_AFFILIATE_OAUTH }}
        shell: bash
        run: |
          set -euo pipefail
          npm run affiliate:check-market
          has_error="$(node -e '
            const batch = require("./.private/market-affiliate-batch.json");
            process.stdout.write(batch.checks.some((item) => item.status === "error") ? "true" : "false");
          ')"
          echo "has_error=$has_error" >> "$GITHUB_OUTPUT"
          if [ "$has_error" = "true" ]; then
            echo "::warning::Часть карточек не проверена после персональных повторов; их CTA будет снят по fail-closed правилу."
          fi

      - name: Собрать публичный снимок и полный production
        if: steps.manifest.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          npm run affiliate:build-snapshot
          npm run affiliate:publish-snapshot
          npm run affiliate:validate-public
          npm run affiliate:test
          npm run build

      - name: Зафиксировать весь проверенный public build
        if: steps.manifest.outputs.count != '0'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            data/affiliate/public-offers.json \
            docs \
            web/index.html \
            web/public

          if ! git diff --quiet; then
            echo "::error::Production build изменил tracked-файлы вне разрешённых public artifacts"
            git diff --name-only
            exit 1
          fi
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Публичный production не изменился."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild verified Market offers [skip ci]"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Запросить сборку GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" \
            -H "X-GitHub-Api-Version: 2022-11-28"

      - name: Дождаться Pages и проверить production build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          built=false
          for _ in $(seq 1 30); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
              -H "X-GitHub-Api-Version: 2022-11-28")"
            status="$(jq -r '.status // "unknown"' <<<"$payload")"
            commit="$(jq -r '.commit // ""' <<<"$payload")"
            if [ "$status" = "built" ] && [ "$commit" = "$target_sha" ]; then
              built=true
              break
            fi
            if [ "$status" = "errored" ] && [ "$commit" = "$target_sha" ]; then
              echo "::error::GitHub Pages не собрал обновлённый снимок"
              exit 1
            fi
            sleep 10
          done
          if [ "$built" != "true" ]; then
            echo "::error::GitHub Pages не подтвердил сборку нужного коммита"
            exit 1
          fi

          node <<'NODE' > /tmp/krepitv-production-artifacts.ndjson
          const fs = require("node:fs");
          const snapshot = JSON.parse(
            fs.readFileSync("data/affiliate/public-offers.json", "utf8"),
          );
          const artifacts = new Map([
            [
              "data/affiliate-offers.json",
              {
                file: "docs/data/affiliate-offers.json",
                url: "https://krepitv.ru/data/affiliate-offers.json",
              },
            ],
          ]);
          for (const offer of snapshot.offers) {
            const relative = `${offer.page_path.replace(/^\//, "")}index.html`;
            artifacts.set(relative, {
              file: `docs/${relative}`,
              url: `https://krepitv.ru${offer.page_path}`,
            });
          }
          for (const artifact of artifacts.values()) {
            if (!fs.existsSync(artifact.file)) {
              throw new Error(`Нет локального production artifact: ${artifact.file}`);
            }
            process.stdout.write(`${JSON.stringify(artifact)}\n`);
          }
          NODE

          deployed=false
          for _ in $(seq 1 30); do
            all_match=true
            while IFS= read -r artifact; do
              file="$(jq -r '.file' <<<"$artifact")"
              url="$(jq -r '.url' <<<"$artifact")"
              output="/tmp/krepitv-$(printf '%s' "$file" | sha256sum | cut -d' ' -f1)"
              if ! curl --fail --silent --show-error --location --max-time 15 \
                -H "Cache-Control: no-cache" \
                "${url}?release=${target_sha}" \
                --output "$output"; then
                all_match=false
                continue
              fi
              if ! cmp --silent "$file" "$output"; then
                all_match=false
              fi
            done < /tmp/krepitv-production-artifacts.ndjson

            if [ "$all_match" = "true" ]; then
              deployed=true
              break
            fi
            sleep 10
          done
          if [ "$deployed" != "true" ]; then
            echo "::error::Production не отдал ожидаемые JSON и статические affiliate-страницы"
            exit 1
          fi

      - name: Сообщить о частичном отказе API
        if: steps.check.outputs.has_error == 'true'
        run: |
          echo "::error::Одна или несколько карточек не прошли техническую проверку после повторов"
          exit 1
