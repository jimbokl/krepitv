name: Проверка предложений Яндекс Маркета

on:
  workflow_dispatch:
  schedule:
    # Два запуска в сутки оставляют запас относительно жёсткого TTL 48 часов.
    - cron: "17 4,16 * * *"

permissions: {}

concurrency:
  group: krepitv-affiliate-health
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
    permissions:
      contents: write
      pages: write
      id-token: write
    if: github.repository == 'jimbokl/krepitv' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Настроить Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Проверить генерацию и манифесты
        shell: bash
        run: |
          set -euo pipefail
          npm run affiliate:validate
          npm run affiliate:validate-hubs
          npm run affiliate:check-model-manifest
          npm run affiliate:validate-models

      - name: Определить количество карточек
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          base_count="$(node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("data/affiliate/market-products.json", "utf8"));
            process.stdout.write(String(data.cards.length));
          ')"
          hub_count="$(node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("data/affiliate/seo-hub-placements.json", "utf8"));
            process.stdout.write(String(data.hubs.reduce((sum, hub) => sum + hub.placements.length, 0)));
          ')"
          model_count="$(node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("data/affiliate/model-page-placements.json", "utf8"));
            process.stdout.write(String(data.expected_offer_count));
          ')"
          count="$((base_count + hub_count + model_count))"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "Манифест пуст: безопасный запуск без сетевых запросов и публикации."
          fi

      - name: Проверить карточки с повторами
        if: steps.manifest.outputs.count != '0'
        id: check
        env:
          YANDEX_MARKET_AFFILIATE_OAUTH: ${{ secrets.YANDEX_MARKET_AFFILIATE_OAUTH }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 .private
          if [ -z "${YANDEX_MARKET_AFFILIATE_OAUTH:-}" ]; then
            echo "::error::Не настроен секрет YANDEX_MARKET_AFFILIATE_OAUTH"
            exit 1
          fi
          npm run affiliate:check-market
          npm run affiliate:check-hubs
          npm run affiliate:check-models
          has_error="$(node -e '
            const base = require("./.private/market-affiliate-batch.json");
            const hubs = require("./.private/market-affiliate-hub-batch.json");
            const models = require("./.private/market-affiliate-model-batch.json");
            const failed = [...base.checks, ...hubs.checks, ...models.checks]
              .some((item) => item.status === "error");
            process.stdout.write(failed ? "true" : "false");
          ')"
          echo "has_error=$has_error" >> "$GITHUB_OUTPUT"
          if [ "$has_error" = "true" ]; then
            echo "::warning::Часть карточек не проверена после персональных повторов; их CTA будет снят по fail-closed правилу."
          fi

      - name: Установить зависимости интерфейса
        if: steps.manifest.outputs.count != '0'
        run: npm --prefix web ci --no-audit --no-fund

      - name: Настроить Rust и WASM target
        if: steps.manifest.outputs.count != '0'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Восстановить кэш Rust
        if: steps.manifest.outputs.count != '0'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          shared-key: affiliate-health

      - name: Установить wasm-pack
        if: steps.manifest.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(wasm-pack --version 2>/dev/null || true)" != "wasm-pack 0.13.1" ]; then
            cargo install wasm-pack --version 0.13.1 --locked
          fi
          wasm-pack --version

      - name: Собрать публичный снимок и полный production
        if: steps.manifest.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          npm run affiliate:build-snapshot
          npm run affiliate:publish-snapshot
          npm run affiliate:validate-public
          npm run affiliate:build-hub-snapshot
          npm run affiliate:publish-hub-snapshot
          npm run affiliate:validate-hubs-public
          npm run affiliate:build-model-snapshot
          npm run affiliate:publish-model-snapshot
          npm run affiliate:validate-models-public
          npm run build

      - name: Зафиксировать весь проверенный public build
        if: steps.manifest.outputs.count != '0'
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            data/affiliate/public-offers.json \
            data/affiliate/public-hub-offers.json \
            data/affiliate/public-model-offers.json \
            docs \
            web/index.html \
            web/public

          if ! git diff --quiet; then
            echo "::error::Production build изменил tracked-файлы вне разрешённых public artifacts"
            git diff --name-only
            exit 1
          fi
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Публичный production не изменился."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild verified Market offers [skip ci]"
          gh auth setup-git
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Настроить GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Загрузить изменившийся production artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs

      - name: Опубликовать изменившийся production artifact
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Проверить production build
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          node <<'NODE' > /tmp/krepitv-production-artifacts.ndjson
          const fs = require("node:fs");
          const snapshot = JSON.parse(
            fs.readFileSync("data/affiliate/public-offers.json", "utf8"),
          );
          const artifacts = new Map([
            [
              "data/affiliate-offers.json",
              {
                file: "docs/data/affiliate-offers.json",
                url: "https://krepitv.ru/data/affiliate-offers.json",
              },
            ],
            [
              "data/affiliate-hub-offers.json",
              {
                file: "docs/data/affiliate-hub-offers.json",
                url: "https://krepitv.ru/data/affiliate-hub-offers.json",
              },
            ],
            [
              "data/affiliate-model-offers.json",
              {
                file: "docs/data/affiliate-model-offers.json",
                url: "https://krepitv.ru/data/affiliate-model-offers.json",
              },
            ],
          ]);
          for (const offer of snapshot.offers) {
            const relative = `${offer.page_path.replace(/^\//, "")}index.html`;
            artifacts.set(relative, {
              file: `docs/${relative}`,
              url: `https://krepitv.ru${offer.page_path}`,
            });
          }
          const hubSnapshot = JSON.parse(
            fs.readFileSync("data/affiliate/public-hub-offers.json", "utf8"),
          );
          for (const placement of hubSnapshot.placements) {
            const relative = `${placement.hub_path.replace(/^\//, "")}index.html`;
            artifacts.set(relative, {
              file: `docs/${relative}`,
              url: `https://krepitv.ru${placement.hub_path}`,
            });
          }
          const modelSnapshot = JSON.parse(
            fs.readFileSync("data/affiliate/public-model-offers.json", "utf8"),
          );
          const models = JSON.parse(fs.readFileSync("data/tv_models.json", "utf8"));
          const modelOfferShardKey = (modelId) => /^samsung-qe\d/u.test(modelId)
            ? "samsung-qe"
            : /^samsung-ue\d/u.test(modelId)
              ? "samsung-ue"
              : modelId.split("-", 1)[0];
          const modelShardKeys = [...new Set(models.map((model) => modelOfferShardKey(model.id)))]
            .sort();
          for (const key of modelShardKeys) {
            const relative = `data/affiliate-model-offers/${key}.json`;
            artifacts.set(relative, {
              file: `docs/${relative}`,
              url: `https://krepitv.ru/${relative}`,
            });
          }
          for (const placement of modelSnapshot.placements) {
            const relative = `${placement.model_path.replace(/^\//, "")}index.html`;
            artifacts.set(relative, {
              file: `docs/${relative}`,
              url: `https://krepitv.ru${placement.model_path}`,
            });
          }
          for (const artifact of artifacts.values()) {
            if (!fs.existsSync(artifact.file)) {
              throw new Error(`Нет локального production artifact: ${artifact.file}`);
            }
            process.stdout.write(`${JSON.stringify(artifact)}\n`);
          }
          NODE

          deployed=false
          for _ in $(seq 1 30); do
            all_match=true
            while IFS= read -r artifact; do
              file="$(jq -r '.file' <<<"$artifact")"
              url="$(jq -r '.url' <<<"$artifact")"
              output="/tmp/krepitv-$(printf '%s' "$file" | sha256sum | cut -d' ' -f1)"
              if ! curl --fail --silent --show-error --location --max-time 15 \
                -H "Cache-Control: no-cache" \
                "${url}?release=${target_sha}" \
                --output "$output"; then
                all_match=false
                continue
              fi
              if ! cmp --silent "$file" "$output"; then
                all_match=false
              fi
            done < /tmp/krepitv-production-artifacts.ndjson

            if [ "$all_match" = "true" ]; then
              deployed=true
              break
            fi
            sleep 10
          done
          if [ "$deployed" != "true" ]; then
            echo "::error::Production не отдал ожидаемые JSON и статические affiliate-страницы"
            exit 1
          fi

      - name: Сообщить о частичном отказе API
        if: steps.check.outputs.has_error == 'true'
        run: |
          echo "::error::Одна или несколько карточек не прошли техническую проверку после повторов"
          exit 1
