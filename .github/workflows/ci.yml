name: Проверка исходников KREPI TV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".node-version"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "crates/**"
      - "data/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "web/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".node-version"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "crates/**"
      - "data/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "web/**"

permissions:
  contents: read

concurrency:
  group: krepitv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'jimbokl/krepitv'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить репозиторий без write-credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Настроить закреплённый Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Настроить закреплённый Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Восстановить кэш Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          shared-key: source-ci

      - name: Установить зависимости интерфейса из lockfile
        run: npm --prefix web ci --no-audit --no-fund

      - name: Установить закреплённый wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(wasm-pack --version 2>/dev/null || true)" != "wasm-pack 0.13.1" ]; then
            cargo install wasm-pack --version 0.13.1 --locked
          fi
          wasm-pack --version

      - name: Собрать и полностью проверить production artifact
        run: npm run build

      - name: Проверить, что сборка совпадает с tracked artifact
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)docs/pkg/krepitv_engine_bg.wasm'
          cmp -s web/public/pkg/krepitv_engine_bg.wasm docs/pkg/krepitv_engine_bg.wasm
