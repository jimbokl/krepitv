name: Сборка и публикация KREPI TV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - ".node-version"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "crates/**"
      - "data/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "web/**"
      - "docs/**"

permissions: {}

concurrency:
  group: krepitv-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jimbokl/krepitv' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходники без write-credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Настроить закреплённый Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Настроить закреплённый Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Восстановить кэш Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          shared-key: pages-build

      - name: Установить зависимости интерфейса из lockfile
        run: npm --prefix web ci --no-audit --no-fund

      - name: Установить закреплённый wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(wasm-pack --version 2>/dev/null || true)" != "wasm-pack 0.13.1" ]; then
            cargo install wasm-pack --version 0.13.1 --locked
          fi
          wasm-pack --version

      - name: Собрать и полностью проверить production artifact
        run: npm run build

      - name: Проверить tracked artifact и публикуемый WASM
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)docs/pkg/krepitv_engine_bg.wasm'
          cmp -s web/public/pkg/krepitv_engine_bg.wasm docs/pkg/krepitv_engine_bg.wasm

      - name: Загрузить artifact из текущей сборки
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs

  deploy:
    needs: build
    if: github.repository == 'jimbokl/krepitv' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Опубликовать artifact текущей сборки
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
