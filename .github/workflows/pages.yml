name: Сборка и публикация KREPI TV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - ".node-version"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "crates/**"
      - "data/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "web/**"
      - "docs/**"

permissions: {}

concurrency:
  group: krepitv-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jimbokl/krepitv' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходники без write-credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Настроить закреплённый Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Настроить закреплённый Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.1
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Восстановить кэш Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          shared-key: pages-build

      - name: Установить зависимости интерфейса из lockfile
        run: npm --prefix web ci --no-audit --no-fund

      - name: Установить закреплённый wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(wasm-pack --version 2>/dev/null || true)" != "wasm-pack 0.13.1" ]; then
            cargo install wasm-pack --version 0.13.1 --locked
          fi
          wasm-pack --version

      - name: Пересобрать production artifact из проверенных исходников
        run: npm run build:release

      - name: Проверить tracked artifact и публикуемый WASM
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)docs/pkg/krepitv_engine_bg.wasm'
          cmp -s web/public/pkg/krepitv_engine_bg.wasm docs/pkg/krepitv_engine_bg.wasm

      - name: Загрузить artifact из текущей сборки
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    if: github.repository == 'jimbokl/krepitv' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Опубликовать artifact текущей сборки
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
