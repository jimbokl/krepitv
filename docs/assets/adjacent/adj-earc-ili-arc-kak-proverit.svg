<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 640' role='img' aria-labelledby='title desc' font-family='Arial, Helvetica, sans-serif'><title id='title'>ARC или eARC: как проверить совместимость</title><desc id='desc'>Наглядная схема из трёх ситуаций: Оба eARC, Только ARC, Маркировка неясна</desc><rect width='960' height='640' fill='#f2ede1'/><rect x='26' y='28' width='908' height='584' rx='30' fill='#f8f5ee' stroke='#181818' stroke-width='3'/><text x='72' y='98' fill='#55534d' font-size='18' font-weight='700' letter-spacing='3'>СХЕМА ПРОВЕРКИ</text><rect x='69' y='142' width='307' height='391' rx='28' fill='#e9e2d4'/><rect x='104' y='180' width='231' height='130' rx='16' fill='#252827' stroke='#181818' stroke-width='6'/><path d='M122 201h193v89H122z' fill='#6979e0' opacity='.74'/><path d='M218 313v32m-58 5h118' stroke='#181818' stroke-width='8' stroke-linecap='round'/><rect x='100' y='293' width='236' height='51' rx='18' fill='#e6e8ff' stroke='#181818' stroke-width='6'/><circle cx='132' cy='318' r='9' fill='#6979e0'/><circle cx='300' cy='318' r='9' fill='#6979e0'/><text x='222' y='477' fill='#181818' font-size='20' font-weight='700' text-anchor='middle'>Саундбары и звук</text><path d='M337 319H370V201H421' fill='none' stroke='#6979e0' stroke-width='5' stroke-linecap='round'/><circle cx='421' cy='201' r='6' fill='#6979e0'/><rect x='430' y='143' width='468' height='117' rx='19' fill='#fffdf8' stroke='#181818' stroke-width='3'/><circle cx='465' cy='182' r='17' fill='#6979e0'/><text x='465' y='189' fill='#181818' font-size='19' font-weight='700' text-anchor='middle'>1</text><text x='496' y='189' fill='#55534d' font-size='18' font-weight='600'>Оба eARC</text><text x='459' y='230' fill='#181818' font-size='24' font-weight='700'>Сверьте режимы</text><path d='M337 319H370V346H421' fill='none' stroke='#6979e0' stroke-width='5' stroke-linecap='round'/><circle cx='421' cy='346' r='6' fill='#6979e0'/><rect x='430' y='288' width='468' height='117' rx='19' fill='#fffdf8' stroke='#181818' stroke-width='3'/><circle cx='465' cy='327' r='17' fill='#6979e0'/><text x='465' y='334' fill='#181818' font-size='19' font-weight='700' text-anchor='middle'>2</text><text x='496' y='334' fill='#55534d' font-size='18' font-weight='600'>Только ARC</text><text x='459' y='375' fill='#181818' font-size='24' font-weight='700'>Не обещайте eARC</text><path d='M337 319H370V491H421' fill='none' stroke='#6979e0' stroke-width='5' stroke-linecap='round'/><circle cx='421' cy='491' r='6' fill='#6979e0'/><rect x='430' y='433' width='468' height='117' rx='19' fill='#fffdf8' stroke='#181818' stroke-width='3'/><circle cx='465' cy='472' r='17' fill='#6979e0'/><text x='465' y='479' fill='#181818' font-size='19' font-weight='700' text-anchor='middle'>3</text><text x='496' y='479' fill='#55534d' font-size='18' font-weight='600'>Маркировка неясна</text><text x='459' y='520' fill='#181818' font-size='24' font-weight='700'>Ищите точные модели</text><text x='72' y='578' fill='#55534d' font-size='17'>Выберите ситуацию в интерактивном помощнике ниже ↓</text></svg>