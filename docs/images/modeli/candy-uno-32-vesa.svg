<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Техническая схема VESA Candy Uno 32</title><desc id="desc">Пропорциональная схема расположения четырёх отверстий VESA 200 на 100 миллиметров. Не фотография и не чертёж корпуса.</desc><rect width="1200" height="630" fill="#F7F5F0"/><rect x="74" y="66" width="1052" height="498" rx="18" fill="#fff" stroke="#111" stroke-width="8"/><rect x="170" y="130" width="860" height="340" rx="10" fill="#111"/><rect x="186" y="146" width="828" height="308" fill="#E9E5DC"/><g fill="#FF4F21" stroke="#111" stroke-width="5"><circle cx="480.0" cy="240.0" r="16"/><circle cx="720.0" cy="240.0" r="16"/><circle cx="480.0" cy="360.0" r="16"/><circle cx="720.0" cy="360.0" r="16"/></g><path d="M480.0 200.0V158M720.0 200.0V158M480.0 174H720.0" stroke="#176B87" stroke-width="5"/><path d="M440.0 240.0H408M440.0 360.0H408M424 240.0V360.0" stroke="#176B87" stroke-width="5"/><text x="600" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#176B87">200 мм</text><text x="382" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#176B87" transform="rotate(-90 382 307)">100 мм</text><text x="92" y="610" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#111">Candy Uno 32 · VESA 200×100 мм · пропорциональная схема отверстий</text></svg>