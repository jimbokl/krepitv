<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Расхождение данных VESA для Hisense 55U7S PRO</title><desc id="desc">Каталог указывает 400×300 мм, руководство указывает 400×400 мм. Размер отверстий нужно проверить по своей модели до выбора кронштейна.</desc><rect width="1200" height="630" fill="#F7F5F0"/><rect x="75" y="75" width="1050" height="480" rx="18" fill="#fff" stroke="#111" stroke-width="8"/><path d="M600 135 865 490H335Z" fill="#FFDFCB" stroke="#111" stroke-width="8"/><text x="600" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="82" font-weight="700" fill="#111">!</text><text x="600" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#111">VESA нужно проверить</text><text x="600" y="594" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#111">Каталог: 400×300 мм · руководство: 400×400 мм</text></svg>