[package]
name = "krepitv-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
# The wasm-opt bundled with wasm-pack 0.13 cannot validate bulk-memory output
# emitted by the current Rust toolchain. The release profile is already size
# optimized and LTO-enabled at the workspace level.
wasm-opt = false
