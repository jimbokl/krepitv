<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 640' role='img' aria-labelledby='title desc' font-family='Arial, Helvetica, sans-serif'><title id='title'>Все HDMI-порты ТВ заняты: что делать</title><desc id='desc'>Наглядная схема из трёх ситуаций: Два обычных источника, Есть консоль, Есть саундбар</desc><rect width='960' height='640' fill='#f2ede1'/><rect x='26' y='28' width='908' height='584' rx='30' fill='#f8f5ee' stroke='#181818' stroke-width='3'/><text x='72' y='98' fill='#55534d' font-size='18' font-weight='700' letter-spacing='3'>СХЕМА ПРОВЕРКИ</text><rect x='69' y='142' width='307' height='391' rx='28' fill='#e9e2d4'/><rect x='104' y='180' width='231' height='130' rx='16' fill='#252827' stroke='#181818' stroke-width='6'/><path d='M122 201h193v89H122z' fill='#3d7fbd' opacity='.74'/><path d='M218 313v32m-58 5h118' stroke='#181818' stroke-width='8' stroke-linecap='round'/><path d='M130 300h82l24 22h92v34h-92l-24 22h-82z' fill='#e8f4ff' stroke='#181818' stroke-width='7' stroke-linejoin='round'/><path d='M157 318v42m25-42v42' stroke='#3d7fbd' stroke-width='8'/><text x='222' y='477' fill='#181818' font-size='20' font-weight='700' text-anchor='middle'>HDMI и кабели</text><path d='M337 319H370V201H421' fill='none' stroke='#3d7fbd' stroke-width='5' stroke-linecap='round'/><circle cx='421' cy='201' r='6' fill='#3d7fbd'/><rect x='430' y='143' width='468' height='117' rx='19' fill='#fffdf8' stroke='#181818' stroke-width='3'/><circle cx='465' cy='182' r='17' fill='#3d7fbd'/><text x='465' y='189' fill='#181818' font-size='19' font-weight='700' text-anchor='middle'>1</text><text x='496' y='189' fill='#55534d' font-size='18' font-weight='600'>Два обычных источника</text><text x='459' y='230' fill='#181818' font-size='24' font-weight='700'>Используйте switch</text><path d='M337 319H370V346H421' fill='none' stroke='#3d7fbd' stroke-width='5' stroke-linecap='round'/><circle cx='421' cy='346' r='6' fill='#3d7fbd'/><rect x='430' y='288' width='468' height='117' rx='19' fill='#fffdf8' stroke='#181818' stroke-width='3'/><circle cx='465' cy='327' r='17' fill='#3d7fbd'/><text x='465' y='334' fill='#181818' font-size='19' font-weight='700' text-anchor='middle'>2</text><text x='496' y='334' fill='#55534d' font-size='18' font-weight='600'>Есть консоль</text><text x='459' y='375' fill='#181818' font-size='24' font-weight='700'>Сохраните режим</text><path d='M337 319H370V491H421' fill='none' stroke='#3d7fbd' stroke-width='5' stroke-linecap='round'/><circle cx='421' cy='491' r='6' fill='#3d7fbd'/><rect x='430' y='433' width='468' height='117' rx='19' fill='#fffdf8' stroke='#181818' stroke-width='3'/><circle cx='465' cy='472' r='17' fill='#3d7fbd'/><text x='465' y='479' fill='#181818' font-size='19' font-weight='700' text-anchor='middle'>3</text><text x='496' y='479' fill='#55534d' font-size='18' font-weight='600'>Есть саундбар</text><text x='459' y='520' fill='#181818' font-size='24' font-weight='700'>Составьте схему</text><text x='72' y='578' fill='#55534d' font-size='17'>Выберите ситуацию в интерактивном помощнике ниже ↓</text></svg>