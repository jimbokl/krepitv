<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Техническая схема кронштейна ONKRON TM5-BW</title><desc id="desc">Условная схема механизма наклонный, нагрузки и поддерживаемых размеров. Не фотография и не монтажный чертёж.</desc><rect width="1200" height="630" fill="#F7F5F0"/><rect x="92" y="72" width="26" height="440" fill="#D8D2C6"/><text x="80" y="552" font-family="Arial,sans-serif" font-size="25" fill="#555">СТЕНА</text><rect x="132" y="206" width="42" height="170" fill="#FF4F21" stroke="#111" stroke-width="6"/><path d="M174 290H704" fill="none" stroke="#111" stroke-width="30"/><circle cx="704" cy="290" r="24" fill="#FF4F21" stroke="#111" stroke-width="6"/><g transform="rotate(-10 704 290)"><rect x="704" y="104" width="270" height="372" rx="12" fill="#fff" stroke="#111" stroke-width="9"/><rect x="738" y="138" width="202" height="304" fill="#E9E5DC"/></g><text x="600" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#111">ONKRON TM5-BW</text><text x="600" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#176B87">наклонный · до 60 кг · 32–70″ · условная схема</text></svg>